[dampf]
; Window: target 800x1000 for laptop/Full HD with taskbar
width = 800
height = 1000
max_width = 800
max_height = 1000
; Outlier panel: flag rows with confidence below this (0–1)
confidence_threshold = 0.3

[paths]
; Leave empty in the shipped template. Paths are machine-local and filled by the GUI.
root_dir =
output_dir =
db_path =

; *.predefined is restored from the program on save and shows the shipped lists.
; *.user is the block the crawl uses. Delete a line there to drop that rule.

