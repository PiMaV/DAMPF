[project]
name = "dampf"
version = "1.3.0"
description = "DAMPF - Filename Semantic Indexer (GUI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0",
]

[project.scripts]
dampf = "dampf.gui:main"
dampf-index = "dampf.filename_semantic_indexer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/dampf"]

[tool.pytest.ini_options]
pythonpath = ["app"]
