[project]
name = "dampf"
version = "0.1.0"
description = "DAMPF - Filename Semantic Indexer (GUI)"
readme = "README.MD"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0",
]

[project.scripts]
dampf = "gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
